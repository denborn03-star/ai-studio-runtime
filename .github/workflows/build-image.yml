name: build-ai-studio-runtime

# Builds and publishes the reproducible AI Studio runtime image to GHCR.
#   GitHub Actions -> GHCR -> immutable sha256 digest
# No local Docker, no WSL, no RunPod involvement.
#
# Build context = REPOSITORY ROOT (this file lives at .github/workflows/ and
# the Dockerfile at the repository root).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements-main.lock'
      - 'requirements-voice.lock'
      - 'scripts/validate-runtime.sh'
      - '.github/workflows/build-image.yml'

permissions:
  contents: read
  packages: write          # required to push to ghcr.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runtime image is large (two baked venvs: ~7.3 GB + ~13 GB). Free the
      # preinstalled toolchains so build + push do not exhaust the runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided; no manual secret

      # Explicit immutable version tag + commit-SHA tag. 'latest' is never the
      # production source of truth.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-studio-runtime
          tags: |
            type=raw,value=runtime-20261008
            type=sha,format=long,prefix=sha-

      # The Dockerfile runs scripts/validate-runtime.sh as a build step, so a
      # validation failure fails the build and NOTHING is pushed.
      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Publish immutable digest
        run: |
          {
            echo "### ai-studio-runtime published"
            echo ""
            echo '```'
            echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
            echo "IMAGE_URI=ghcr.io/${{ github.repository_owner }}/ai-studio-runtime@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
